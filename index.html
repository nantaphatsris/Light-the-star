<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Sky Tracker - Rectangle Selector</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090d12;
      color: #edf2f7;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #26313d;
    }

    h1 {
      font-size: 18px;
      margin: 0;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    .camera-view {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #030609;
      border: 1px solid #354352;
      border-radius: 12px;
      overflow: hidden;
      touch-action: manipulation;
      cursor: pointer;
    }

    video {
      display: none;
    }

    canvas#canvasOutput {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* วงกลมอ้างอิงตรงกลาง (0, 0) */
    .crosshair {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid #6000fb;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
    }

    .crosshair::before {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      background: #0bf4ec;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    /* กล่องแสดงพิกัด */
    .coordinates {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #0bf4ec;
      font-size: 13px;
      font-family: monospace;
      line-height: 1.8;
      border: 1px solid #26313d;
      border-radius: 6px;
      pointer-events: none;
      z-index: 3;
    }

    .controls {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #0bf4ec;
      color: #10241a;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #354352;
      color: #888;
      cursor: not-allowed;
    }

    button:active:not(:disabled) {
      opacity: 0.8;
    }

    #status {
      color: #9eacbd;
      font-size: 13px;
      margin-top: 12px;
      line-height: 1.6;
    }

    .hint {
      color: #9eacbd;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 10px;
    }
  </style>

  <!-- โหลด OpenCV.js -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>
</head>

<body>
  <header>
    <h1>✳ NIGHT SKY TRACKER - RECTANGLE SELECTOR</h1>
  </header>

  <main>
    <div class="camera-view" id="cameraView">
      <video id="camera" autoplay playsinline muted></video>
      <canvas id="canvasOutput"></canvas>

      <!-- จุดกำเนิดพิกัด (0,0) -->
      <div class="crosshair"></div>

      <!-- แสดงพิกัด -->
      <div class="coordinates">
        Target Selected: <span id="detectedStatus" style="color: #ff4d4d;">NO</span><br>
        X: <span id="coordX">0</span> px<br>
        Y: <span id="coordY">0</span> px
      </div>
    </div>

    <div class="controls">
      <button id="startCamera" disabled>กำลังโหลด OpenCV.js...</button>
    </div>

    <div id="status">สถานะ: รอโหลด OpenCV.js</div>

    <div class="hint">
      * ระบบจะตรวจจับรูปทรงสี่เหลี่ยมทั้งหมดในกล้อง (กรอบสีเหลือง)<br>
      * <b>แตะ/จิ้ม ที่สี่เหลี่ยมบนหน้าจอ</b> เพื่อเลือกเป็นเป้าหมาย (กรอบจะเปลี่ยนเป็นสีเขียว)
    </div>
  </main>

  <script>
    const camera = document.getElementById("camera");
    const canvasOutput = document.getElementById("canvasOutput");
    const cameraView = document.getElementById("cameraView");
    const button = document.getElementById("startCamera");
    const status = document.getElementById("status");
    const coordX = document.getElementById("coordX");
    const coordY = document.getElementById("coordY");
    const detectedStatus = document.getElementById("detectedStatus");

    let stream = null;
    let isOpenCvReady = false;
    let isProcessing = false;

    // ตัวแปรเก็บพิกัดการแตะเลือกของผู้ใช้ (บนหน้าจอ)
    let selectedPoint = null;

    // เรียกเมื่อ OpenCV.js โหลดเสร็จสิ้น
    function onOpenCvReady() {
      isOpenCvReady = true;
      status.textContent = "สถานะ: OpenCV.js พร้อมทำงาน กดเปิดกล้องได้เลย";
      button.textContent = "เปิดกล้องส่องหา";
      button.disabled = false;
    }

    // ฟังก์ชันคำนวณตำแหน่งการแตะบนหน้าจอ แปลงเป็นพิกัดภาพ Canvas
    cameraView.addEventListener("pointerdown", (e) => {
      const rect = cameraView.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // แปลงอัตราส่วนตำแหน่งแตะให้ตรงกับขนาดจริงของ Canvas
      const scaleX = canvasOutput.width / rect.width;
      const scaleY = canvasOutput.height / rect.height;

      selectedPoint = {
        x: clickX * scaleX,
        y: clickY * scaleY
      };
    });

    // แสดงค่าพิกัดบน UI
    function displayCoordinates(x, y, isFound) {
      coordX.textContent = Math.round(x);
      coordY.textContent = Math.round(y);
      if (isFound) {
        detectedStatus.textContent = "YES";
        detectedStatus.style.color = "#0bf4ec";
      } else {
        detectedStatus.textContent = "NO";
        detectedStatus.style.color = "#ff4d4d";
      }
    }

    // ฟังก์ชันประมวลผลตรวจจับรูปทรงสี่เหลี่ยม (Shape Detection / Contours)
    function processVideo() {
      if (!isProcessing) return;

      const width = camera.videoWidth;
      const height = camera.videoHeight;

      if (width === 0 || height === 0) {
        requestAnimationFrame(processVideo);
        return;
      }

      if (canvasOutput.width !== width || canvasOutput.height !== height) {
        canvasOutput.width = width;
        canvasOutput.height = height;
      }

      const ctx = canvasOutput.getContext("2d");
      ctx.drawImage(camera, 0, 0, width, height);

      try {
        let srcMat = cv.imread(canvasOutput);
        let grayMat = new cv.Mat();
        let blurredMat = new cv.Mat();
        let thresholdMat = new cv.Mat();
        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();

        // 1. แปลงเป็นสีเทา + ลด Noise
        cv.cvtColor(srcMat, grayMat, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(grayMat, blurredMat, new cv.Size(5, 5), 0);
        
        // 2. หาขอบภาพด้วย Canny
        cv.Canny(blurredMat, thresholdMat, 50, 150);

        // 3. ค้นหาเส้นขอบวัตถุ (Contours)
        cv.findContours(thresholdMat, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        let targetFound = false;

        // 4. วนลูปเช็คว่า Contour ไหนเป็น "สี่เหลี่ยม"
        for (let i = 0; i < contours.size(); ++i) {
          let cnt = contours.get(i);
          let peri = cv.arcLength(cnt, true);
          let approx = new cv.Mat();

          // ปรับระดับความโค้งเพื่อย่อมุม (Approximation)
          cv.approxPolyDP(cnt, approx, 0.04 * peri, true);

          // ถ้ามี 4 มุม และมีพื้นที่มากพอ
          let area = cv.contourArea(cnt);
          if (approx.rows === 4 && area > 1000) {
            let rect = cv.boundingRect(approx);

            // เช็คว่าผู้ใช้แตะเลือกสี่เหลี่ยมรูปนี้หรือไม่
            let isSelected = false;
            if (selectedPoint) {
              if (
                selectedPoint.x >= rect.x &&
                selectedPoint.x <= rect.x + rect.width &&
                selectedPoint.y >= rect.y &&
                selectedPoint.y <= rect.y + rect.height
              ) {
                isSelected = true;
                targetFound = true;

                // คำนวณพิกัดกึ่งกลางสี่เหลี่ยมเทียบกับจุดกึ่งกลางหน้าจอ (0, 0)
                const objectCenterX = rect.x + rect.width / 2;
                const objectCenterY = rect.y + rect.height / 2;
                const screenCenterX = width / 2;
                const screenCenterY = height / 2;

                const relX = objectCenterX - screenCenterX;
                const relY = screenCenterY - objectCenterY;

                displayCoordinates(relX, relY, true);

                // วาดกรอบสีเขียวสด (Target Selected)
                let p1 = new cv.Point(rect.x, rect.y);
                let p2 = new cv.Point(rect.x + rect.width, rect.y + rect.height);
                cv.rectangle(srcMat, p1, p2, [11, 244, 236, 255], 4);
              }
            }

            // สี่เหลี่ยมอื่นๆ ที่ยังไม่ได้กดเลือก ให้วาดกรอบสีเหลือง/ส้มบางๆ ไว้
            if (!isSelected) {
              let p1 = new cv.Point(rect.x, rect.y);
              let p2 = new cv.Point(rect.x + rect.width, rect.y + rect.height);
              cv.rectangle(srcMat, p1, p2, [255, 180, 0, 200], 2);
            }
          }
          approx.delete();
        }

        if (!targetFound && !selectedPoint) {
          displayCoordinates(0, 0, false);
        }

        cv.imshow("canvasOutput", srcMat);

        // คืนการถือครอง Memory ของ OpenCV
        srcMat.delete();
        grayMat.delete();
        blurredMat.delete();
        thresholdMat.delete();
        contours.delete();
        hierarchy.delete();

      } catch (err) {
        console.error(err);
      }

      requestAnimationFrame(processVideo);
    }

    // ปุ่มเปิด/ปิด กล้อง
    button.addEventListener("click", async () => {
      if (!isOpenCvReady) return;

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("เบราว์เซอร์ไม่รองรับการเปิดกล้อง (กรุณารันผ่าน HTTPS หรือ localhost)");
        }

        if (stream) {
          isProcessing = false;
          stream.getTracks().forEach(track => track.stop());
          stream = null;
          button.textContent = "เปิดกล้องส่องหา";
          status.textContent = "สถานะ: ปิดกล้องแล้ว";
          selectedPoint = null;
          return;
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });

        camera.srcObject = stream;
        await camera.play();

        isProcessing = true;
        status.textContent = "สถานะ: กล้องกำลังทำงาน แตะสี่เหลี่ยมบนหน้าจอเพื่อเลือก Target";
        button.textContent = "ปิดกล้อง";

        requestAnimationFrame(processVideo);

      } catch (error) {
        status.textContent = "เปิดกล้องไม่สำเร็จ: " + error.message;
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
        stream = null;
        isProcessing = false;
      }
    });
  </script>
</body>
</html>
